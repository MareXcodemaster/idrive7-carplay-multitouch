name: Compatibility or touch test
description: Report a specific MGU and CarPlay receiver test without sharing private data.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Share only the requested fields. Do not upload a VIN, SSH key, password, pairing record, complete log, firmware file, or system dump.
  - type: input
    id: mgu-version
    attributes:
      label: MGU software version
      description: General software version only. Do not include the VIN.
      placeholder: P18_23w44.2-1-3
    validations:
      required: true
  - type: input
    id: original-hash
    attributes:
      label: Original /usr/bin/carplay SHA-256
      description: Copy the hash from the compatibility check, not the executable itself.
    validations:
      required: true
  - type: dropdown
    id: receiver
    attributes:
      label: Connection tested
      options:
        - iPhone directly to factory BMW CarPlay
        - Android AI box through factory BMW CarPlay
        - Compatibility check only; no activation
    validations:
      required: true
  - type: input
    id: receiver-version
    attributes:
      label: Receiver model and software
      description: iPhone model and iOS version, or box model and firmware version. Omit serial numbers and network addresses.
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Application and version used for testing
      description: For example, Apple Maps or the Android touch tester.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual gesture results
      description: State whether taps work, two-finger pinch works, each finger releases correctly, and the pointer count observed. Distinguish observations from guesses.
    validations:
      required: true
  - type: textarea
    id: sanitized-status
    attributes:
      label: Relevant sanitized status or error
      description: Include only the specific result or error. Remove private identifiers and paths. Do not attach full logs or firmware.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed VINs, private keys, credentials, pairing data, device identifiers, and proprietary firmware.
          required: true
