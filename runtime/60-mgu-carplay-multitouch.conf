# MGU CarPlay Multitouch: owned drop-in. Remove this file to restore stock on reboot.
# Keeps the stock OnFailure handling and all stock arguments/environment.
[Service]
# Remove selection even when Node/package has disappeared; default is factory.
ExecStartPre=-+/bin/sh -c 'rm -f /run/mgu-carplay-multitouch/selected'
ExecStartPre=-+/usr/bin/node /var/opt/mgu-carplay-multitouch/manager.js prepare
ExecStart=
# The manager selects the installed copy, or a composed executable that holds this
# patch and another registered CarPlay patch; anything else starts the factory file.
ExecStart=/bin/sh -c 'v=; if [ -r /run/mgu-carplay-multitouch/selected ]; then v="$$(cat /run/mgu-carplay-multitouch/selected)"; fi; if [ "$$v" = "2a009e6afe22f8f385b164ec9e2a7c2aa22b1c1c3ac2110d04f80715dc2c01de" ] && [ -x /var/opt/mgu-carplay-multitouch/carplay ]; then exec /var/opt/mgu-carplay-multitouch/carplay "$$@"; fi; case "$$v" in "composed "*) if [ -x /var/opt/mgu-carplay-patch/carplay ]; then exec /var/opt/mgu-carplay-patch/carplay "$$@"; fi;; esac; exec /usr/bin/carplay "$$@"' -- -c /etc/cinemo/cinemo_options.xml
ExecStartPost=-+/usr/bin/node /var/opt/mgu-carplay-multitouch/manager.js health-start
ExecStopPost=-+/usr/bin/node /var/opt/mgu-carplay-multitouch/manager.js stopped
# Avoid the observed factory CarPlay SIGTERM teardown crash during service changes.
KillSignal=SIGKILL
SuccessExitStatus=SIGKILL
